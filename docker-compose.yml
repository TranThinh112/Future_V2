services:
  app:
    build: .
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: crypto, POSTGRES_PASSWORD: crypto, POSTGRES_DB: crypto}
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
